[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent"
version = "0.10.1"
description = "企业软件交付与技术支持 Agent，含业务结果评测和共享质量治理能力"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core install stays light: ReAct loop / tools / harness do not need embedding models.
# Memory keyword fallback works without sklearn; semantic memory/RAG need [rag].
dependencies = []

[project.optional-dependencies]
rag = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "sentence-transformers>=2.2,<4",
    "pymilvus>=2.4,<3",
]
langgraph = [
    # 与已验证的 LangGraph 1.2.x / langchain-core 1.5.x 对齐。
    "langgraph>=1.2.11,<1.3",
    "langchain-core>=1.5.4,<1.6",
    "langchain-openai>=1.1,<2",
]
mysql = [
    "pymysql>=1.1,<2",
]
service = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0,<7",
    "flake8>=6.0,<8",
]
dev = [
    "react-agent[rag,test,langgraph,mysql,service,postgres]",
    "mypy>=1.8",
    "pip-audit>=2.6",
]

[project.scripts]
agent = "react_agent.react_loop:cli_entry"
react-agent-server = "react_agent.server.app:main"
react-agent-api = "react_agent.server.fastapi_app:main"
react-agent-mcp-server = "react_agent.server.mcp_delivery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
react_agent = [
    "eval/*.json",
    "eval/**/*.json",
    "apps/docs_troubleshoot/golden.json",
    "apps/docs_troubleshoot/corpus/*.md",
    "apps/expense/business_cases.json",
    "apps/security_triage/*.json",
    "server/static/*.html",
]

[tool.pytest.ini_options]
markers = [
    "real_llm: live LLM integration tests (need DEEPSEEK_API_KEY)",
    "real_llm_smoke: minimal live LLM subset for CI",
    "mysql_live: live MySQL persistence tests (need MYSQL URL and pymysql)",
]
