[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent"
version = "0.9.0"
description = "Agent 运行时 + 三类主流应用（编码/执行 · 客服/自动化 · RAG/研究）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core install stays light: ReAct loop / tools / harness do not need embedding models.
# Memory keyword fallback works without sklearn; semantic memory/RAG need [rag].
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<8",
]

[project.optional-dependencies]
rag = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "sentence-transformers>=2.2,<4",
]
langgraph = [
    "langgraph>=0.2.28,<0.5",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
]
# FastAPI 服务面（react-agent-api）。core install 保持轻量：不装它时
# react_agent.server.fastapi_app 仍可导入，只是无法作为 ASGI 应用对外提供。
# SQLAlchemy + psycopg 是 PostgreSQL 任务持久化的运行时依赖。
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0,<7",
    "ruff>=0.8,<1",
    # tests/test_fastapi_skill_api.py 用 httpx 的 ASGI transport 驱动 FastAPI 应用；
    # CI 只装 `.[test]`，因此这两个必须在此自足，不能只依赖 [service]。
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
dev = [
    "react-agent[rag,test,langgraph,service]",
    "mypy>=1.8",
    "pip-audit>=2.6",
]

[project.scripts]
agent = "react_agent.react_loop:cli_entry"
react-agent-server = "react_agent.server.app:main"
react-agent-api = "react_agent.server.fastapi_app:main"
react-agent-worker = "react_agent.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
react_agent = [
    "eval/*.json",
    "eval/**/*.json",
    "apps/docs_troubleshoot/golden.json",
    "apps/docs_troubleshoot/corpus/*.md",
    "apps/expense/business_cases.json",
    "server/static/*.html",
]

[tool.pytest.ini_options]
markers = [
    "real_llm: live LLM integration tests (need DEEPSEEK_API_KEY)",
    "real_llm_smoke: minimal live LLM subset for CI",
]
# 所有可再生缓存集中到 .cache/，根目录不再出现 .pytest_cache/。
cache_dir = ".cache/pytest"

# mypy 默认写根目录 .mypy_cache/；同样收进 .cache/。
[tool.mypy]
cache_dir = ".cache/mypy"

# Keep the legacy Pyflakes-only lint profile during the migration; additional
# formatting/import rules can be adopted separately once their findings have
# been reviewed.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
ignore = ["F401", "F841", "F541"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ALL"]
"**/test*.py" = ["ALL"]
"**/__init__.py" = ["ALL"]
