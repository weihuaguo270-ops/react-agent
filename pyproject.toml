[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent"
version = "0.10.0"
description = "Agent 运行时 + 三类主流应用（编码/执行 · 客服/自动化 · RAG/研究）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core install stays light: ReAct loop / tools / harness do not need embedding models.
# Memory keyword fallback works without sklearn; semantic memory/RAG need [rag].
dependencies = []

[project.optional-dependencies]
rag = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "sentence-transformers>=2.2,<4",
]
langgraph = [
    # 与已验证的 LangGraph 1.2.x / langchain-core 1.5.x 对齐。
    "langgraph>=1.2.11,<1.3",
    "langchain-core>=1.5.4,<1.6",
    "langchain-openai>=1.1,<2",
]
mysql = [
    "pymysql>=1.1,<2",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0,<7",
    "flake8>=6.0,<8",
]
dev = [
    "react-agent[rag,test,langgraph,mysql]",
    "mypy>=1.8",
    "pip-audit>=2.6",
]

[project.scripts]
agent = "react_agent.react_loop:cli_entry"
react-agent-server = "react_agent.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
react_agent = [
    "eval/*.json",
    "eval/**/*.json",
    "apps/docs_troubleshoot/golden.json",
    "apps/docs_troubleshoot/corpus/*.md",
    "apps/expense/business_cases.json",
    "server/static/*.html",
]

[tool.pytest.ini_options]
markers = [
    "real_llm: live LLM integration tests (need DEEPSEEK_API_KEY)",
    "real_llm_smoke: minimal live LLM subset for CI",
    "mysql_live: live MySQL persistence tests (need MYSQL URL and pymysql)",
]
