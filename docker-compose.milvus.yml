services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >-
      /usr/local/bin/etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus-etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  docs-troubleshoot:
    build:
      context: .
      args:
        REACT_AGENT_INSTALL_EXTRAS: rag
        REACT_AGENT_TORCH_VERSION: 2.7.1+cpu
    environment:
      REACT_AGENT_RAG_BACKEND: milvus
      REACT_AGENT_MILVUS_URI: http://milvus:19530
      REACT_AGENT_MILVUS_COLLECTION: react_agent_rag
      REACT_AGENT_MILVUS_DIMENSION: "512"
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
