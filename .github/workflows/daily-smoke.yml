name: Daily smoke

# Cross-day variance for P0 soft-tail: offline execution + reliability mock.
# UTC 01:00 ≈ Asia/Shanghai 09:00.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      with_agent:
        description: "Also run easy agent smoke (uses DEEPSEEK_API_KEY)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  daily-smoke:
    runs-on: ubuntu-latest
    # 自闭环最多要跑 3 轮 CI，单轮约 5 分钟
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the job can push variance log commits.
          # SMOKE_PAT（可选）：真人身份的令牌，能让 pull_request 触发的 CI 正常跑；
          # 未配置时回落到 GITHUB_TOKEN，行为与旧版一致。
          token: ${{ secrets.SMOKE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[test]"

      - name: Run daily smoke (offline / mock)
        env:
          REACT_AGENT_SKIP_RAG: "1"
          REACT_AGENT_DISABLE_MCP: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_agent }}" = "true" ]; then
            EXTRA="--with-agent"
          fi
          python examples/eval/run_daily_smoke.py $EXTRA

      - name: Commit variance log, open PR and drive it to merge
        env:
          # 可选升级：配置 SMOKE_PAT（fine-grained PAT，需 contents / pull-requests / actions = write）
          # 后，PR 由真人身份创建，pull_request 触发的 CI 不再被 first-time contributor 门禁拦下，
          # auto-merge 可以自行闭环；未配置时回落到 GITHUB_TOKEN，由本步骤显式驱动到合并。
          GH_TOKEN: ${{ secrets.SMOKE_PAT || secrets.GITHUB_TOKEN }}
          SMOKE_PAT_SET: ${{ secrets.SMOKE_PAT != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/ 同时是 git-docs 评测的 RAG 语料：VARIANCE.md 一改，
          # tests/test_git_docs_corpus_drift.py 就报 changed，必需检查 test 必红，
          # 合并永远落不了地。所以提交前同步刷新语料基线并一起纳入本次提交。
          python examples/eval/run_git_docs_eval.py --refresh-baseline
          git add docs/daily_smoke/log.jsonl docs/daily_smoke/VARIANCE.md \
                  src/react_agent/apps/docs_troubleshoot/git_docs_corpus_baseline.json
          if git diff --staged --quiet; then
            echo "No variance log changes"
            exit 0
          fi

          smoke_date="$(date -u +%Y-%m-%d)"
          branch="automation/daily-smoke-${smoke_date}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m "chore(daily-smoke): append ${smoke_date} variance row"
          git push origin "HEAD:refs/heads/${branch}"

          pr_url="$(gh pr create --repo "${REPO}" \
            --base main \
            --head "${branch}" \
            --title "chore(daily-smoke): append ${smoke_date} variance row" \
            --body "Automated variance log update from Daily smoke run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}).")"
          pr_number="${pr_url##*/}"
          echo "Created ${pr_url}"

          # 兜底：配了 SMOKE_PAT 时 auto-merge 能自己闭环；只有 GITHUB_TOKEN 时，GitHub 把
          # bot 当 first-time contributor，pull_request 那次运行会停在 action_required（0 个 job），
          # 必需检查只能靠本步骤 dispatch 的运行提供，所以下面显式驱动它一路到合并，
          # 免得又留下一个「残留 PR」。
          gh pr merge "${pr_number}" --repo "${REPO}" --squash --auto \
            || echo "::warning::auto-merge 开启失败，改由本步骤显式合并：${pr_url}" >&2

          is_merged() {
            [ "$(gh pr view "${pr_number}" --repo "${REPO}" --json state --jq .state)" = "MERGED" ]
          }

          latest_run_id() {  # $1 = event name
            gh run list --repo "${REPO}" --branch "${branch}" --event "$1" --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0'
          }

          await_run() {  # $1 = event, $2 = 已经见过的 run id
            local run_id
            for _ in $(seq 1 60); do
              run_id="$(latest_run_id "$1")"
              if [ "${run_id}" != "0" ] && [ "${run_id}" != "$2" ]; then
                echo "${run_id}"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          seen_pr="0"
          seen_dispatch="0"
          for attempt in 1 2 3; do
            if is_merged; then echo "Merged ${pr_url}"; exit 0; fi

            echo "--- CI round ${attempt}"
            if [ "${SMOKE_PAT_SET}" = "true" ]; then
              # 真人身份的 push 会自己触发 pull_request 运行，不需要也不应该再 dispatch 一次。
              run_id="$(await_run pull_request "${seen_pr}")" || {
                echo "::warning::未等到 pull_request 运行，需人工处理：${pr_url}" >&2; exit 0; }
              seen_pr="${run_id}"
            else
              gh workflow run test.yml --repo "${REPO}" --ref "${branch}" -f suite=smoke
              run_id="$(await_run workflow_dispatch "${seen_dispatch}")" || {
                echo "::warning::未等到 dispatch 运行，需人工处理：${pr_url}" >&2; exit 0; }
              seen_dispatch="${run_id}"
            fi

            if ! gh run watch "${run_id}" --repo "${REPO}" --exit-status; then
              echo "::error::CI 未通过（run ${run_id}），PR 保留待人工处理：${pr_url}"
              gh pr comment "${pr_number}" --repo "${REPO}" \
                --body "CI 未通过：run ${run_id}（branch \`${branch}\`）。修复后重新 dispatch 该分支的 CI 即可自动合并。" || true
              exit 1
            fi
            if is_merged; then echo "Merged ${pr_url} (auto-merge)"; exit 0; fi

            state="$(gh pr view "${pr_number}" --repo "${REPO}" --json mergeStateStatus --jq .mergeStateStatus)"
            echo "mergeStateStatus=${state}"
            if [ "${state}" = "BEHIND" ]; then
              # main 前进过：分支更新后的新 SHA 必须重新跑一遍 CI，所以回到循环开头。
              # 注意 GITHUB_TOKEN 的 push 不触发 workflow，只有真人身份（SMOKE_PAT）才会。
              if ! gh pr update-branch "${pr_number}" --repo "${REPO}"; then
                git fetch origin main
                git merge --no-edit origin/main
                git push origin "HEAD:refs/heads/${branch}"
              fi
              continue
            fi

            if gh pr merge "${pr_number}" --repo "${REPO}" --squash; then
              echo "Merged ${pr_url}"
              exit 0
            fi
            echo "::warning::第 ${attempt} 轮合并未成功（mergeStateStatus=${state}），重试" >&2
            sleep 20
          done

          echo "::warning::未能在本步骤合并，需人工处理：${pr_url}" >&2
