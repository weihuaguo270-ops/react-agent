name: Daily smoke

# Optional evidence-only cross-day smoke: offline execution + reliability mock.
# UTC 01:00 is approximately Asia/Shanghai 09:00.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      with_agent:
        description: "Also run easy agent smoke (uses DEEPSEEK_API_KEY)"
        type: boolean
        default: false

# Daily smoke observes the repository; it does not write branches, PRs, or main.
permissions:
  contents: read

jobs:
  daily-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[test]"

      - name: Run daily smoke (offline / mock)
        env:
          REACT_AGENT_SKIP_RAG: "1"
          REACT_AGENT_DISABLE_MCP: "1"
          # Offline execution calls CONFIRM tools without an approval client.
          # Keep production's default async approval unchanged; this is an
          # explicit non-production evaluation escape hatch.
          REACT_AGENT_APPROVAL_MODE: "auto_allow"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_agent }}" = "true" ]; then
            EXTRA="--with-agent"
          fi
          python scripts/eval/smoke/run_daily_smoke.py $EXTRA

      # The generated files are evidence for this run only. Keeping them in an
      # artifact avoids turning a low-frequency observation into a write-capable
      # PR and merge automation path.
      - name: Upload daily smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            docs/daily_smoke/log.jsonl
            docs/daily_smoke/VARIANCE.md
