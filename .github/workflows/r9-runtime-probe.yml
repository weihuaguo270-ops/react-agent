name: R9 runtime probe

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: R9 fork runtime evidence (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Execute the probe from the trusted base revision, never the fork head.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Collect fork and SHA evidence
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/ci/r9_runtime_probe.py --output artifacts/ci/r9-runtime-probe.json
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r9-runtime-probe
          path: artifacts/ci/r9-runtime-probe.json
          if-no-files-found: error
