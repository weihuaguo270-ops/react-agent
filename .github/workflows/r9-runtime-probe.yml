name: R9 runtime probe

on:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    name: R9 fork runtime and Phase 1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Collect fork and SHA evidence
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRUSTED_WORKFLOW_REF: ${{ job.workflow_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python trusted/scripts/ci/r9_runtime_probe.py --output candidate/artifacts/ci/r9-runtime-probe.json
          jq --arg event_name "$GITHUB_EVENT_NAME" \
             --arg workflow_ref "$TRUSTED_WORKFLOW_REF" \
             --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
             '. + {event_name: $event_name, trusted_workflow_ref: $workflow_ref, run_url: $run_url}' \
             candidate/artifacts/ci/r9-runtime-probe.json > candidate/artifacts/ci/r9-runtime-probe.tmp
          mv candidate/artifacts/ci/r9-runtime-probe.tmp candidate/artifacts/ci/r9-runtime-probe.json
      - name: Install candidate project dependencies
        working-directory: candidate
        run: python -m pip install -e ".[test]"
      - name: Run Phase 1 gate with current-head evidence
        working-directory: candidate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/ci/ci_stage_gate.py --stage "Phase 1"
          --r9-runtime-evidence artifacts/ci/r9-runtime-probe.json
          --expected-head-sha "$PR_HEAD_SHA"
          --expected-base-sha "$PR_BASE_SHA"
      - name: Upload runtime evidence and Phase 1 gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r9-phase1-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            candidate/artifacts/ci/r9-runtime-probe.json
            candidate/artifacts/ci/stage-gates/phase-1-*.json
          if-no-files-found: error
