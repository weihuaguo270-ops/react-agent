name: CI

on:
  push:
    branches:
      - main
    # Release tags point at commits already validated on their branch.
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  # 事件名参与分组：workflow_dispatch 运行与 pull_request 运行曾因同 ref 互相 cancel，
  # 必需检查只剩一半结论（#96/#99/#104 的 test 矩阵就是一半 failure 一半 cancelled）。
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ready:
    name: PR ready audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        # Check the actual PR head, not GitHub's synthetic merge ref.
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install project dependencies
      run: pip install -e ".[test]"
    - name: Check PR readiness
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python scripts/ci/check_pr_ready.py --ci --base-sha "$PR_BASE_SHA" --allow-revert

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install lint tools
      run: pip install "ruff>=0.8,<1"
    - name: Lint
      run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI offline pillars/scripts call execute_python without an approval client.
    # Runtime default remains async; pytest also setdefaults this in conftest.
    env:
      REACT_AGENT_APPROVAL_MODE: auto_allow
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e ".[test]"
    - name: Script tests
      run: python test_all.py
    - name: Pytest (offline)
      run: >-
        pytest tests/ -q
        --ignore=tests/test_real_llm.py
        --ignore=tests/test_harness_closed_loop_decision.py
        --ignore=tests/evaluation/test_harness_closed_loop_decision.py
    - name: Portable user-data directories
      env:
        REACT_AGENT_DATA_DIR: /tmp/react-agent-data
      run: |
        pytest tests/test_portable_paths.py -q
        python -c "from react_agent.memory import Memory; from react_agent.rag import RAG; assert Memory().save_path.startswith('/tmp/react-agent-data'); assert RAG().save_path.startswith('/tmp/react-agent-data')"
    - name: Coverage (3.11)
      if: matrix.python-version == '3.11'
      run: |
        pip install pytest-cov
        pytest tests/ -q \
          --ignore=tests/test_real_llm.py \
          --ignore=tests/test_harness_closed_loop_decision.py \
          --ignore=tests/evaluation/test_harness_closed_loop_decision.py \
          --cov=react_agent --cov-report=term-missing --cov-fail-under=35
  # Windows: default console often GBK — catch emoji/encoding regressions early
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -e ".[test]"
    - name: Script tests (no PYTHONIOENCODING)
      shell: powershell
      run: |
        Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
        python test_all.py
    - name: Pytest offline + console/final-answer guards
      shell: powershell
      run: |
        Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
        $env:REACT_AGENT_SKIP_RAG = "1"
        python -m pytest tests/test_console_io.py tests/test_final_answer_guard.py tests/test_eval_engine_contract.py tests/test_harness_schema.py tests/test_core_lazy_imports.py -q
    - name: Schema validate fixture (siblings optional on Windows)
      shell: powershell
      run: |
        Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
        python -c "from pathlib import Path; import json; from react_agent.harness.schema import validate_trajectory; errs=validate_trajectory(json.loads(Path('fixtures/harness_closed_loop.json').read_text(encoding='utf-8'))); print(errs or 'schema OK'); raise SystemExit(1 if errs else 0)"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install -e ".[test]" mypy
    - run: >
        mypy src/react_agent
        --ignore-missing-imports
        --allow-untyped-defs
        --allow-incomplete-defs
        --exclude '(tot|planner|orchestrator|rag|mcp_client|dashboard|intent)/?'
        --disable-error-code=arg-type
        --disable-error-code=assignment
        --disable-error-code=attr-defined
        --disable-error-code=return-value
        --disable-error-code=union-attr
        --disable-error-code=var-annotated
        --disable-error-code=misc
        --disable-error-code=operator
        --disable-error-code=call-overload
        --disable-error-code=name-defined
        --disable-error-code=index
        --disable-error-code=has-type
        --disable-error-code=valid-type
        --disable-error-code=call-arg

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: pip-audit in clean venv
      run: |
        python -m venv .audit-venv
        .audit-venv/bin/python -m pip install -U pip "setuptools>=83"
        .audit-venv/bin/python -m pip install -e ".[test]" pip-audit
        .audit-venv/bin/pip-audit --progress-spinner off

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install smoke client dependencies
      run: python -m pip install -e .
    - name: Build image
      run: docker build -t react-agent:ci .
    - name: Run container
      run: |
        docker run -d --name react-agent-ci -p 8765:8765 \
          -e REACT_AGENT_SERVER_OFFLINE_REACT=1 \
          react-agent:ci
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8765/ready >/dev/null; then
            break
          fi
          sleep 1
        done
        curl -sf http://127.0.0.1:8765/ready
        PYTHONPATH=src python scripts/eval/smoke/run_deploy_smoke.py --url http://127.0.0.1:8765
    - name: Stop container
      if: always()
      run: docker rm -f react-agent-ci || true

