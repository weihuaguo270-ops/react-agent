name: CI shadow observation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    name: Aggregate report-only shadow evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Collect report-only artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/collect_shadow_observation.py \
            --repo "${{ github.repository }}" \
            --output artifacts/ci/shadow-observation/report.json
      - name: Upload shadow observation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-shadow-observation
          path: artifacts/ci/shadow-observation/
          if-no-files-found: warn
