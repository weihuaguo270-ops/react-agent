name: Harness stage gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Harness scope
    runs-on: ubuntu-latest
    outputs:
      run_harness_stage: ${{ steps.scope.outputs.run_harness_stage }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
          echo "run_harness_stage=true" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch explicitly requested the P4 gate."
          exit 0
        elif [ "${EVENT_NAME}" = "pull_request" ]; then
          base="${PR_BASE_SHA}"
          head="${PR_HEAD_SHA}"
        else
          echo "run_harness_stage=false" >> "$GITHUB_OUTPUT"
          echo "No stable base/head pair to verify a stage-completion declaration."
          exit 0
        fi
        python scripts/ci/harness_stage_scope.py --base "$base" --head "$head" --stage P4 --github-output "$GITHUB_OUTPUT"

  stage-gate:
    name: Harness P4 stage gate
    needs: scope
    if: needs.scope.outputs.run_harness_stage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install project dependencies
      run: pip install -e ".[test]"
    - name: Install cross-repository gate dependencies
      run: |
        set -e
        git clone --depth=1 https://github.com/weihuaguo270-ops/llm-eval-engine.git /tmp/llm-eval-engine
        git clone --depth=1 https://github.com/weihuaguo270-ops/trace-debugger.git /tmp/trace-debugger
        pip install -e /tmp/llm-eval-engine -e /tmp/trace-debugger
    - name: Run P4 stage gate
      run: python scripts/ci/harness_stage_gate.py --stage P4
