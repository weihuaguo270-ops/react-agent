<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库</title>
<style>
:root {
  --bg: #faf9f7;
  --card: #ffffff;
  --border: #d4d1cc;
  --text: #1a1816;
  --muted: #736b5e;
  --link: #3d5a80;
  --hover: #2a4261;
  --error-bg: #fef5f5;
  --error-border: #e8c5c5;
  --error-text: #8b3a3a;
  --warn-bg: #fef8f0;
  --warn-border: #e5d5b8;
  --warn-text: #7a5e2f;
  --info-bg: #f5f7fa;
  --info-border: #cbd5e0;
  --info-text: #4a5568;
  --success-bg: #f0f5f0;
  --success-border: #c3d8c3;
  --success-text: #3a6b3a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ===== Views ===== */
.view {
  display: none;
}

.view.active {
  display: block;
}

/* ===== Identity View ===== */
.identity-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 20px;
}

.identity-header {
  margin-bottom: 40px;
}

.identity-header h1 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.identity-header p {
  color: var(--muted);
  font-size: 13px;
}

.identity-panel {
  max-width: 420px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 28px;
}

.identity-panel h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 18px;
}

.identity-panel label {
  display: block;
  font-size: 13px;
  color: var(--text);
  margin-bottom: 6px;
}

.identity-panel input {
  width: 100%;
  border: 1px solid var(--border);
  padding: 9px 11px;
  font: inherit;
  background: #fff;
  margin-bottom: 8px;
}

.identity-panel input:focus {
  outline: none;
  border-color: var(--link);
}

.identity-hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 18px;
}

.identity-error {
  display: none;
  background: var(--error-bg);
  border: 1px solid var(--error-border);
  color: var(--error-text);
  padding: 10px 12px;
  font-size: 12px;
  margin-bottom: 16px;
}

.identity-error.show {
  display: block;
}

.btn {
  border: 1px solid var(--border);
  padding: 9px 16px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  background: var(--card);
  color: var(--text);
  transition: background 0.15s, border-color 0.15s;
}

.btn-primary {
  background: var(--text);
  color: var(--card);
  border-color: var(--text);
  width: 100%;
  font-weight: 500;
}

.btn-primary:hover {
  background: #2a2725;
  border-color: #2a2725;
}

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ===== Workspace View ===== */
.workspace-container {
  max-width: 1600px;
  margin: 0 auto;
  padding: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Top Bar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.topbar-left {
  font-size: 13px;
  color: var(--muted);
}

.topbar-left strong {
  font-weight: 500;
  color: var(--text);
}

.topbar-right {
  display: flex;
  gap: 6px;
}

.btn-ghost {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-ghost:hover {
  color: var(--text);
  border-color: var(--border);
}

/* Banner */
.banner {
  display: none;
  padding: 11px 14px;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 10px;
  border: 1px solid;
}

.banner.show {
  display: block;
}

.banner.warning {
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--warn-text);
}

.banner.info {
  background: var(--info-bg);
  border-color: var(--info-border);
  color: var(--info-text);
}

/* Three Column Layout */
.workspace-main {
  display: grid;
  grid-template-columns: 280px 1fr 380px;
  gap: 10px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.workspace-main.no-detail {
  grid-template-columns: 280px 1fr;
}

@media (max-width: 1200px) {
  .workspace-main {
    grid-template-columns: 260px 1fr;
  }

  .detail-panel {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: rgba(0,0,0,0.2);
    display: none;
  }

  .detail-panel.show {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .detail-content {
    background: var(--card);
    max-width: 680px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--border);
  }
}

@media (max-width: 900px) {
  .workspace-main {
    grid-template-columns: 1fr;
  }

  .workspace-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab-btn.active {
    background: var(--text);
    color: var(--card);
    border-color: var(--text);
  }

  .docs-panel, .chat-panel {
    display: none;
  }

  .docs-panel.active, .chat-panel.active {
    display: flex;
  }
}

/* Panel Common */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.panel-header {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.panel-title {
  font-size: 13px;
  font-weight: 600;
}

.panel-count {
  font-size: 12px;
  color: var(--muted);
  margin-left: 6px;
  font-weight: 400;
}

.panel-actions {
  display: flex;
  gap: 6px;
}

.btn-icon {
  background: transparent;
  border: 1px solid transparent;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
  color: var(--muted);
  transition: all 0.15s;
}

.btn-icon:hover {
  color: var(--text);
  border-color: var(--border);
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

/* ===== Documents Panel ===== */
.docs-panel {
  grid-column: 1;
}

.doc-item {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}

.doc-item:hover {
  background: #f7f6f5;
}

.doc-item.active {
  background: #f0efed;
}

.doc-item:last-child {
  border-bottom: none;
}

.doc-item-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.doc-item-meta {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

.doc-item-meta a {
  color: var(--link);
  text-decoration: none;
}

.doc-item-meta a:hover {
  text-decoration: underline;
}

.docs-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* Ingest Panel */
.ingest-panel {
  display: none;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 14px;
}

.ingest-panel.show {
  display: block;
}

.ingest-panel h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}

.ingest-panel label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
  margin-top: 10px;
}

.ingest-panel label:first-of-type {
  margin-top: 0;
}

.ingest-panel input,
.ingest-panel textarea {
  width: 100%;
  border: 1px solid var(--border);
  padding: 7px 9px;
  font: inherit;
  font-size: 12px;
  background: #fff;
}

.ingest-panel textarea {
  min-height: 70px;
  resize: vertical;
}

.ingest-panel input:focus,
.ingest-panel textarea:focus {
  outline: none;
  border-color: var(--link);
}

.ingest-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

.btn-secondary {
  background: #fff;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-secondary:hover {
  background: #f7f6f5;
}

.btn-sm {
  padding: 6px 11px;
  font-size: 12px;
}

.ingest-status {
  display: none;
  margin-top: 10px;
  padding: 9px 11px;
  font-size: 11px;
  line-height: 1.5;
  border: 1px solid;
}

.ingest-status.show {
  display: block;
}

.ingest-status.success {
  background: var(--success-bg);
  border-color: var(--success-border);
  color: var(--success-text);
}

.ingest-status.error {
  background: var(--error-bg);
  border-color: var(--error-border);
  color: var(--error-text);
}

.ingest-status.loading {
  background: var(--info-bg);
  border-color: var(--info-border);
  color: var(--info-text);
}

/* ===== Detail Panel ===== */
.detail-panel {
  grid-column: 2;
}

.detail-toolbar {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.detail-toolbar-left {
  display: flex;
  gap: 6px;
  align-items: center;
}

.detail-toolbar-right {
  display: flex;
  gap: 6px;
}

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  line-height: 1.7;
}

.detail-doc-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.detail-doc-title {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 10px;
}

.detail-doc-source {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}

.detail-doc-source a {
  color: var(--link);
  text-decoration: none;
}

.detail-doc-source a:hover {
  text-decoration: underline;
}

.detail-doc-info {
  font-size: 11px;
  color: var(--muted);
}

.detail-section {
  margin-bottom: 28px;
}

.detail-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.detail-section-content {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

.detail-edit input,
.detail-edit textarea {
  width: 100%;
  border: 1px solid var(--border);
  padding: 9px 11px;
  font: inherit;
  background: #fff;
  margin-bottom: 12px;
}

.detail-edit textarea {
  min-height: 180px;
  resize: vertical;
  font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
  font-size: 13px;
  line-height: 1.6;
}

.detail-edit-actions {
  display: flex;
  gap: 6px;
  padding-top: 12px;
}

/* ===== Chat Panel ===== */
.chat-panel {
  grid-column: 3;
}

@media (max-width: 1200px) {
  .chat-panel {
    grid-column: 2;
  }
}

.chat-thread {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  background: #fcfcfb;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-bubble {
  max-width: 88%;
  padding: 9px 12px;
  line-height: 1.6;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
  border: 1px solid;
}

.chat-bubble.user {
  align-self: flex-end;
  background: #f0efed;
  border-color: #dddad5;
  color: var(--text);
}

.chat-bubble.assistant {
  align-self: flex-start;
  background: #fff;
  border-color: var(--border);
  color: var(--text);
}

.chat-bubble.assistant.warn {
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--warn-text);
}

.chat-bubble.assistant.error {
  background: var(--error-bg);
  border-color: var(--error-border);
  color: var(--error-text);
}

.chat-bubble.assistant.success {
  background: var(--success-bg);
  border-color: var(--success-border);
  color: var(--success-text);
}

.chat-bubble a {
  color: var(--link);
  text-decoration: underline;
}

.chat-trace {
  margin-top: 8px;
  padding: 7px 9px;
  background: rgba(0,0,0,0.02);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
}

.chat-trace summary {
  cursor: pointer;
  user-select: none;
  font-weight: 500;
}

.chat-trace-content {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--border);
  line-height: 1.5;
}

.chat-composer {
  border-top: 1px solid var(--border);
  padding: 11px;
  background: var(--card);
  flex-shrink: 0;
}

.chat-composer textarea {
  width: 100%;
  border: 1px solid var(--border);
  padding: 9px 11px;
  font: inherit;
  font-size: 13px;
  background: #fff;
  resize: none;
  min-height: 70px;
  max-height: 140px;
  overflow-y: auto;
}

.chat-composer textarea:focus {
  outline: none;
  border-color: var(--link);
}

.chat-composer-actions {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.chat-disabled {
  padding: 32px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.chat-disabled-title {
  font-weight: 500;
  margin-bottom: 10px;
  color: var(--text);
}

/* Utility */
.hidden {
  display: none !important;
}

.loading {
  opacity: 0.5;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- Identity View -->
<div class="view active" id="view-identity">
  <div class="identity-container">
    <div class="identity-header">
      <h1>个人知识库</h1>
      <p>请先确认员工身份</p>
    </div>

    <div class="identity-panel">
      <h2>确认身份</h2>
      <label for="actor-input">员工身份</label>
      <input
        id="actor-input"
        type="text"
        placeholder="工号"
        autocomplete="off"
      >
      <div class="identity-hint">
        不同身份的文档相互隔离。
      </div>
      <div class="identity-error" id="identity-error"></div>
      <button class="btn btn-primary" id="identity-confirm">
        进入
      </button>
    </div>
  </div>
</div>

<!-- Workspace View -->
<div class="view" id="view-workspace">
  <div class="workspace-container">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        当前身份：<strong id="ws-actor-label">—</strong>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost" id="btn-refresh-docs">刷新</button>
        <button class="btn-ghost" id="btn-change-actor">更换身份</button>
      </div>
    </div>

    <!-- Banner -->
    <div class="banner warning" id="llm-banner">
      当前未接入对话模型，暂不能通过对话改写或生成文档。仍可加入链接、PDF 和文件。
    </div>

    <!-- Mobile Tabs (hidden on desktop) -->
    <div class="workspace-tabs hidden">
      <button class="tab-btn active" data-tab="docs">文档</button>
      <button class="tab-btn" data-tab="chat">对话</button>
      <button class="tab-btn hidden" data-tab="detail" id="tab-detail">阅读</button>
    </div>

    <!-- Three Column Layout -->
    <div class="workspace-main no-detail">
      <!-- Left: Documents Panel -->
      <div class="panel docs-panel active">
        <div class="panel-header">
          <div>
            <span class="panel-title">文档</span>
            <span class="panel-count" id="doc-count">(0)</span>
          </div>
          <div class="panel-actions">
            <button class="btn-icon" id="btn-add-doc" title="加入">+</button>
            <button class="btn-icon" id="btn-reload-docs" title="刷新">⟳</button>
          </div>
        </div>
        <div class="panel-body" id="docs-list">
          <div class="docs-empty">
            还没有文档，可以加入链接、文件，或把内容粘贴进来。
          </div>
        </div>

        <!-- Ingest Panel -->
        <div class="ingest-panel" id="ingest-panel">
          <h3>加入资料</h3>
          <label>链接（可选）</label>
          <input type="text" id="ingest-url" placeholder="https://">

          <label>或粘贴正文（可选）</label>
          <textarea id="ingest-text" placeholder=""></textarea>

          <label>或选择本地文件（可选）</label>
          <input type="file" id="ingest-file" accept=".pdf,.txt,.md,.markdown,.html,.htm,.json">

          <label>摘要要求（可选）</label>
          <input type="text" id="ingest-requirement" placeholder="例如：重点摘安装步骤">

          <div class="ingest-actions">
            <button class="btn btn-secondary btn-sm" id="btn-ingest">加入</button>
            <button class="btn btn-secondary btn-sm" id="btn-cancel-ingest">取消</button>
          </div>

          <div class="ingest-status" id="ingest-status"></div>
        </div>
      </div>

      <!-- Middle: Detail Panel (hidden by default) -->
      <div class="panel detail-panel" id="detail-panel">
        <div class="detail-toolbar">
          <div class="detail-toolbar-left">
            <button class="btn-ghost" id="btn-close-detail">← 返回</button>
          </div>
          <div class="detail-toolbar-right">
            <button class="btn-ghost" id="btn-edit-doc">编辑</button>
            <button class="btn-ghost" id="btn-close-detail-x">×</button>
          </div>
        </div>
        <div class="detail-body" id="detail-body">
          <!-- Document content will be loaded here -->
        </div>
      </div>

      <!-- Right: Chat Panel -->
      <div class="panel chat-panel active">
        <div class="panel-header">
          <div class="panel-title">对话</div>
          <div class="panel-actions">
            <button class="btn-icon" id="btn-clear-chat" title="清空">🗑</button>
          </div>
        </div>
        <div class="chat-thread" id="chat-thread">
        </div>
        <div class="chat-composer">
          <textarea
            id="chat-input"
            placeholder="输入说明，或粘贴链接、正文"
            rows="3"
          ></textarea>
          <div class="chat-composer-actions">
            <button class="btn btn-secondary btn-sm" id="btn-send-chat">发送</button>
            <button class="btn btn-secondary btn-sm" id="btn-reset-chat">清空</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== State =====
let currentActor = '';
let documents = [];
let currentDocumentId = null;
let chatHistory = [];
let llmAvailable = true;

// ===== Utility Functions =====
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(el => {
    el.classList.toggle('active', el.id === viewId);
  });
}

function showError(elementId, message) {
  const el = document.getElementById(elementId);
  if (el) {
    el.textContent = message;
    el.classList.add('show');
  }
}

function hideError(elementId) {
  const el = document.getElementById(elementId);
  if (el) {
    el.classList.remove('show');
  }
}

function actorHeaders() {
  return {
    'Content-Type': 'application/json',
    'X-Actor-Id': currentActor,
    'Accept': 'application/json'
  };
}

// ===== Identity Functions =====
function confirmIdentity() {
  const raw = (document.getElementById('actor-input').value || '').trim();

  if (!raw) {
    showError('identity-error', '请填写员工身份');
    return;
  }

  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(raw)) {
    showError('identity-error', '身份格式不正确');
    return;
  }

  hideError('identity-error');
  currentActor = raw;
  document.getElementById('ws-actor-label').textContent = raw;

  showView('view-workspace');
  resetChat();
  loadDocuments();
  checkLlmAvailability();
}

function changeActor() {
  if (!confirm('更换身份后当前对话将清空。确认继续？')) {
    return;
  }

  currentActor = '';
  currentDocumentId = null;
  documents = [];
  chatHistory = [];

  document.getElementById('ws-actor-label').textContent = '—';
  document.getElementById('actor-input').value = '';
  hideError('identity-error');

  showView('view-identity');
  setTimeout(() => document.getElementById('actor-input').focus(), 100);
}

// ===== LLM Check =====
async function checkLlmAvailability() {
  try {
    const resp = await fetch('/v1/info');
    const data = await resp.json();
    llmAvailable = data.default_mode !== 'offline';

    const banner = document.getElementById('llm-banner');
    if (!llmAvailable) {
      banner.classList.add('show');
      showChatDisabled();
    } else {
      banner.classList.remove('show');
    }
  } catch (e) {
    console.error('Failed to check LLM availability:', e);
  }
}

// ===== Document Functions =====
async function loadDocuments() {
  try {
    const headers = actorHeaders();
    delete headers['Content-Type'];

    const resp = await fetch('/v1/docs/personal/documents', { headers });
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || resp.statusText);
    }

    documents = data.documents || data.bookmarks || data.sources || [];
    renderDocuments();
  } catch (e) {
    console.error('Failed to load documents:', e);
    renderDocumentsError(e.message);
  }
}

function renderDocuments() {
  const container = document.getElementById('docs-list');
  const countEl = document.getElementById('doc-count');

  countEl.textContent = `(${documents.length})`;

  if (documents.length === 0) {
    container.innerHTML = `
      <div class="docs-empty">
        还没有文档，可以加入链接、文件，或把内容粘贴进来。
      </div>
    `;
    return;
  }

  container.innerHTML = documents.map(doc => {
    const source = doc.url
      ? `<a href="${esc(doc.url)}" target="_blank" rel="noopener noreferrer">${esc(truncateUrl(doc.url))}</a>`
      : (doc.filename ? esc(doc.filename) : '本地');

    const date = formatDate(doc.updated_at || doc.ingested_at || '');
    const isActive = currentDocumentId === doc.id;

    return `
      <div class="doc-item ${isActive ? 'active' : ''}" data-id="${esc(doc.id)}">
        <div class="doc-item-title">${esc(doc.title || '未命名文档')}</div>
        <div class="doc-item-meta">${source} · ${date}</div>
      </div>
    `;
  }).join('');

  // Attach click handlers
  document.querySelectorAll('.doc-item').forEach(item => {
    item.addEventListener('click', () => {
      const docId = item.dataset.id;
      openDocument(docId);
    });
  });
}

function truncateUrl(url) {
  if (url.length <= 40) return url;
  const parsed = new URL(url);
  return parsed.hostname + (parsed.pathname.length > 20 ? parsed.pathname.slice(0, 20) + '...' : parsed.pathname);
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return '刚刚';
  if (diffMins < 60) return `${diffMins} 分钟前`;
  if (diffHours < 24) return `${diffHours} 小时前`;
  if (diffDays < 7) return `${diffDays} 天前`;

  const month = d.getMonth() + 1;
  const day = d.getDate();
  return `${month}/${day}`;
}

function renderDocumentsError(message) {
  const container = document.getElementById('docs-list');
  container.innerHTML = `
    <div class="docs-empty">
      加载失败：${esc(message)}
    </div>
  `;
}

async function openDocument(docId) {
  currentDocumentId = docId;

  try {
    const headers = actorHeaders();
    delete headers['Content-Type'];

    const resp = await fetch(`/v1/docs/personal/documents/${encodeURIComponent(docId)}`, { headers });
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || resp.statusText);
    }

    const doc = data.document || data.bookmark || {};
    renderDocumentDetail(doc);
    showDetailPanel();
    renderDocuments(); // Update active state
  } catch (e) {
    console.error('Failed to load document:', e);
    alert('无法加载文档：' + e.message);
  }
}

function renderDocumentDetail(doc) {
  const source = doc.url
    ? `<a href="${esc(doc.url)}" target="_blank" rel="noopener noreferrer">${esc(doc.url)}</a>`
    : (doc.filename ? esc(doc.filename) : '本地');

  const dateInfo = doc.updated_at || doc.ingested_at || '';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-doc-header">
      <h2 class="detail-doc-title">${esc(doc.title || '未命名文档')}</h2>
      <div class="detail-doc-source">来源：${source}</div>
      <div class="detail-doc-info">${esc(dateInfo)} · ${esc(doc.char_count || 0)} 字</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">摘要</div>
      <div class="detail-section-content">${esc(doc.summary || '（无摘要）')}</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">正文</div>
      <div class="detail-section-content">${esc(doc.body || '（无正文）')}</div>
    </div>
  `;
}

function showDetailPanel() {
  const workspace = document.querySelector('.workspace-main');
  const detailPanel = document.getElementById('detail-panel');

  workspace.classList.remove('no-detail');
  detailPanel.classList.add('show');

  // Mobile: show detail tab
  const detailTab = document.getElementById('tab-detail');
  if (detailTab) {
    detailTab.classList.remove('hidden');
  }
}

function closeDetailPanel() {
  const workspace = document.querySelector('.workspace-main');
  const detailPanel = document.getElementById('detail-panel');

  workspace.classList.add('no-detail');
  detailPanel.classList.remove('show');

  currentDocumentId = null;
  renderDocuments(); // Update active state

  // Mobile: hide detail tab
  const detailTab = document.getElementById('tab-detail');
  if (detailTab) {
    detailTab.classList.add('hidden');
  }
}

function editDocument() {
  if (!currentDocumentId) return;

  const doc = documents.find(d => d.id === currentDocumentId);
  if (!doc) return;

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-edit">
      <label>标题</label>
      <input type="text" id="edit-title" value="${esc(doc.title || '')}">

      <label>摘要</label>
      <textarea id="edit-summary" rows="4">${esc(doc.summary || '')}</textarea>

      <label>正文</label>
      <textarea id="edit-body">${esc(doc.body || '')}</textarea>

      <div class="detail-edit-actions">
        <button class="btn btn-secondary btn-sm" id="btn-save-edit">保存</button>
        <button class="btn btn-secondary btn-sm" id="btn-cancel-edit">取消</button>
      </div>
    </div>
  `;

  document.getElementById('btn-save-edit').addEventListener('click', saveDocumentEdit);
  document.getElementById('btn-cancel-edit').addEventListener('click', () => openDocument(currentDocumentId));
}

async function saveDocumentEdit() {
  if (!currentDocumentId) return;

  const title = document.getElementById('edit-title').value;
  const summary = document.getElementById('edit-summary').value;
  const body = document.getElementById('edit-body').value;

  try {
    const resp = await fetch(`/v1/docs/personal/documents/${encodeURIComponent(currentDocumentId)}`, {
      method: 'POST',
      headers: actorHeaders(),
      body: JSON.stringify({ title, summary, body })
    });

    const data = await resp.json();

    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || resp.statusText);
    }

    await loadDocuments();
    await openDocument(currentDocumentId);

    appendChatBubble('assistant', '已保存', 'success');
  } catch (e) {
    console.error('Failed to save document:', e);
    alert('保存失败：' + e.message);
  }
}

// ===== Ingest Functions =====
function showIngestPanel() {
  document.getElementById('ingest-panel').classList.add('show');
}

function hideIngestPanel() {
  document.getElementById('ingest-panel').classList.remove('show');
  clearIngestForm();
}

function clearIngestForm() {
  document.getElementById('ingest-url').value = '';
  document.getElementById('ingest-text').value = '';
  document.getElementById('ingest-file').value = '';
  document.getElementById('ingest-requirement').value = '';
  hideIngestStatus();
}

function showIngestStatus(message, type = 'loading') {
  const status = document.getElementById('ingest-status');
  status.textContent = message;
  status.className = `ingest-status show ${type}`;
}

function hideIngestStatus() {
  document.getElementById('ingest-status').classList.remove('show');
}

async function ingestDocument() {
  const url = document.getElementById('ingest-url').value.trim();
  const text = document.getElementById('ingest-text').value.trim();
  const file = document.getElementById('ingest-file').files[0];
  const requirement = document.getElementById('ingest-requirement').value.trim();

  if (!url && !text && !file) {
    showIngestStatus('请至少填写一项', 'error');
    return;
  }

  showIngestStatus('正在加入...', 'loading');

  try {
    const payload = { url, text, requirement };

    if (file) {
      const base64 = await readFileAsBase64(file);
      payload.filename = file.name;
      payload.content_base64 = base64;
      payload.content_type = file.type;
    }

    const resp = await fetch('/v1/docs/personal/ingest', {
      method: 'POST',
      headers: actorHeaders(),
      body: JSON.stringify(payload)
    });

    const data = await resp.json();

    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || resp.statusText);
    }

    const doc = data.document || data.bookmark || {};
    showIngestStatus(`已加入「${doc.title || '未命名文档'}」`, 'success');

    await loadDocuments();

    setTimeout(() => {
      hideIngestPanel();
    }, 1500);
  } catch (e) {
    console.error('Failed to ingest document:', e);
    showIngestStatus('加入失败：' + e.message, 'error');
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      const idx = result.indexOf(',');
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

// ===== Chat Functions =====
function appendChatBubble(role, text, className = '') {
  const thread = document.getElementById('chat-thread');
  const bubble = document.createElement('div');
  bubble.className = `chat-bubble ${role} ${className}`.trim();
  bubble.textContent = text;
  thread.appendChild(bubble);
  thread.scrollTop = thread.scrollHeight;

  chatHistory.push({ role, content: text });
}

function resetChat() {
  const thread = document.getElementById('chat-thread');
  thread.innerHTML = '';
  chatHistory = [];
  document.getElementById('chat-input').value = '';
}

function showChatDisabled() {
  const thread = document.getElementById('chat-thread');
  thread.innerHTML = `
    <div class="chat-disabled">
      <div class="chat-disabled-title">当前未接入对话模型</div>
      暂不能通过对话改写或生成文档。仍可加入链接、PDF 和文件。
    </div>
  `;

  document.getElementById('chat-input').disabled = true;
  document.getElementById('btn-send-chat').disabled = true;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();

  if (!message) return;

  appendChatBubble('user', message);
  input.value = '';

  // Show typing indicator
  const thread = document.getElementById('chat-thread');
  const typingId = 'typing-' + Date.now();
  const typing = document.createElement('div');
  typing.id = typingId;
  typing.className = 'chat-bubble assistant';
  typing.textContent = '...';
  thread.appendChild(typing);
  thread.scrollTop = thread.scrollHeight;

  try {
    const resp = await fetch('/v1/docs/personal/agent/chat', {
      method: 'POST',
      headers: actorHeaders(),
      body: JSON.stringify({ message })
    });

    const data = await resp.json();

    // Remove typing indicator
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || resp.statusText);
    }

    const answer = data.answer || data.reply || '无回复';
    const refused = data.refused || answer.includes('个人库中没有足够依据');
    const needsLlm = data.needs_llm;

    if (needsLlm) {
      appendChatBubble('assistant', answer, 'warn');
    } else if (refused) {
      appendChatBubble('assistant', answer, 'warn');
    } else {
      appendChatBubble('assistant', answer);
    }

    // If document was added/updated, reload list
    if (answer.includes('已加入') || answer.includes('已合并') || answer.includes('已保存')) {
      await loadDocuments();
    }
  } catch (e) {
    // Remove typing indicator
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    console.error('Failed to send chat:', e);
    appendChatBubble('assistant', '发送失败：' + e.message, 'error');
  }
}

// ===== Event Handlers =====
document.getElementById('identity-confirm').addEventListener('click', confirmIdentity);
document.getElementById('actor-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') confirmIdentity();
});

document.getElementById('btn-change-actor').addEventListener('click', changeActor);
document.getElementById('btn-refresh-docs').addEventListener('click', loadDocuments);
document.getElementById('btn-reload-docs').addEventListener('click', loadDocuments);

document.getElementById('btn-add-doc').addEventListener('click', showIngestPanel);
document.getElementById('btn-cancel-ingest').addEventListener('click', hideIngestPanel);
document.getElementById('btn-ingest').addEventListener('click', ingestDocument);

document.getElementById('btn-close-detail').addEventListener('click', closeDetailPanel);
document.getElementById('btn-close-detail-x').addEventListener('click', closeDetailPanel);
document.getElementById('btn-edit-doc').addEventListener('click', editDocument);

document.getElementById('btn-send-chat').addEventListener('click', sendChat);
document.getElementById('btn-reset-chat').addEventListener('click', () => {
  if (confirm('确认清空对话记录？')) {
    resetChat();
  }
});
document.getElementById('btn-clear-chat').addEventListener('click', () => {
  if (confirm('确认清空对话记录？')) {
    resetChat();
  }
});

document.getElementById('chat-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// Auto-expand textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

// Focus on load
window.addEventListener('load', () => {
  document.getElementById('actor-input').focus();
});
</script>
